<!DOCTYPE html>
<html>
<head>
    <title>Our Menu - Cozy Cafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffaf3;
            color: #3e2723;
            margin: 0;
        }

        header {
            background-color: #3e2723;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        h2 {
            text-align: center;
            margin: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 20px;
        }

        .item {
            background-color: white;
            width: 220px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 10px #ddd;
        }

        .item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        footer {
            background-color: #3e2723;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

    <div class="item">
